name: Release & Publish Action to Marketplace

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  release-and-publish:
    name: Self-Generate Notes & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code & Full History
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve Release Tag
        id: resolve_tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Generate AI Release Notes (Self-Dogfooding)
        id: notes
        uses: ./
        with:
          version: ${{ steps.resolve_tag.outputs.tag }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          groq-api-key: ${{ secrets.GROQ_API_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve_tag.outputs.tag }}
        run: |
          PRERELEASE_FLAG=()
          if [[ "${TAG}" == *-* ]]; then
            PRERELEASE_FLAG=(--prerelease)
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" \
              --title "${TAG}" \
              --notes-file "${{ steps.notes.outputs.notes_path }}" \
              "${PRERELEASE_FLAG[@]}"
          else
            gh release create "${TAG}" \
              --title "${TAG}" \
              --notes-file "${{ steps.notes.outputs.notes_path }}" \
              --verify-tag \
              "${PRERELEASE_FLAG[@]}"
          fi
